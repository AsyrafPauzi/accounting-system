; BukuCloud self-hosted runtime PHP defaults.
;
; Sized for an SME workload (5-50 active users, occasional large PDF
; / OCR uploads). Customers can override individual values by mounting
; another file under /usr/local/etc/php/conf.d/zzz-overrides.ini.

memory_limit = 256M

; Receipt uploads + bulk export zip downloads can reach 30-50 MB on
; phones with high-res cameras + multi-page PDFs.
upload_max_filesize = 64M
post_max_size       = 80M
max_file_uploads    = 30
max_execution_time  = 300

; Don't expose PHP version in headers — tiny win, but free.
expose_php = Off

date.timezone = "Asia/Kuala_Lumpur"
