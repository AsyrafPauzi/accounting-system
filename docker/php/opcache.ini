; OPcache tuning for BukuCloud self-hosted runtime.
;
; validate_timestamps=0 means we never re-read files at runtime — the
; only way to pick up a new bundle is to restart the container, which
; matches our "pull new image, restart" upgrade model. Customers who
; mount the source tree as a volume during dev should toggle this.

opcache.enable                = 1
opcache.enable_cli            = 0
opcache.memory_consumption    = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps   = 0
opcache.revalidate_freq       = 0
opcache.save_comments         = 1
