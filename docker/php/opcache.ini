; OPcache tuning for production PHP-FPM.
; Defaults ship with very small caches; for a Laravel app these settings
; typically deliver 30–50% throughput vs. unconfigured OPcache.

opcache.enable=1
opcache.enable_cli=0

; Memory and file table sizing. Laravel + dependencies easily exceed 10k
; files, so 20k headroom prevents thrash. 256 MiB is enough for the app
; plus framework + vendor; the LRU eviction won't run in steady state.
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000

; In production the bytecode never changes between deploys (image is
; immutable), so we skip the timestamp `stat` call on every include —
; biggest single performance win. Each deploy resets the cache because
; the container is replaced.
opcache.validate_timestamps=0
opcache.revalidate_freq=0

; Safer fast-shutdown path; keep comments for debugging stack traces.
opcache.fast_shutdown=1
opcache.save_comments=1

; Prevent serving partially-cached files when a deploy ships truncated
; opcode files (rare but catastrophic).
opcache.file_cache_consistency_checks=1

; Function/file-level JIT. PHP 8+ JIT helps on tight loops; safe at default.
opcache.jit_buffer_size=64M
opcache.jit=tracing
