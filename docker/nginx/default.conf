# Nginx config for the BukuCloud self-hosted Docker stack.
# Forwards PHP requests to the `app` service on port 9000.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Standard Laravel front-controller routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Block access to obvious dotfiles and the storage dir
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* /storage/private/ {
        deny all;
    }

    # Larger max body so photo receipts + OCR PDFs don't 413.
    client_max_body_size 80M;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT  $realpath_root;
        include fastcgi_params;

        # OCR endpoints can take a few seconds.
        fastcgi_read_timeout 300;
    }

    # Static asset caching.
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?|svg|webp|avif)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
