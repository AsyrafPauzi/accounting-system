map $http_x_forwarded_proto $fastcgi_https {
    default off;
    https   on;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    # Hide nginx version from error pages / Server header.
    server_tokens off;

    # Upload ceiling: matches Laravel's 10 MiB OCR file rule + headroom for
    # multipart overhead. PHP `upload_max_filesize` should match (12M).
    # Anything larger is rejected at the edge before reaching PHP-FPM.
    client_max_body_size 12M;
    client_body_timeout 30s;
    client_header_timeout 10s;

    # Security headers are set by App\Http\Middleware\SecurityHeaders for
    # every PHP-rendered response (so values stay in one place). We DO NOT
    # set X-Frame-Options / X-Content-Type-Options here to avoid duplicate
    # or conflicting headers if the middleware ever changes.

    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Long-lived caching for hashed Vite build artifacts. The hash in the
    # filename invalidates on rebuild, so immutable + 1y is safe.
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS $fastcgi_https;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    # Block direct access to dotfiles (.git, .env etc.) — except .well-known
    # which is needed for Let's Encrypt-style HTTP-01 challenges.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
